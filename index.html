<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Progress</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <h1 class="page__title">Progress</h1>

      <div class="demo" aria-label="Демонстрация блока Progress">
        <section class="demo__preview" aria-label="Индикатор прогресса">
          <div id="progress"></div>
        </section>

        <form class="controls" id="controls">
          <label class="control control--value">
            <input
              class="control__input control__input--number"
              id="value"
              type="number"
              min="0"
              max="100"
              value="60"
              inputmode="numeric"
            />
            <span class="control__label">Value</span>
          </label>

          <label class="control">
            <input class="control__input control__input--switch" id="animate" type="checkbox" />
            <span class="control__switch" aria-hidden="true"></span>
            <span class="control__label">Animate</span>
          </label>

          <label class="control">
            <input class="control__input control__input--switch" id="hide" type="checkbox" />
            <span class="control__switch" aria-hidden="true"></span>
            <span class="control__label">Hide</span>
          </label>
        </form>
      </div>
    </main>

    <script src="./js/Progress.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
